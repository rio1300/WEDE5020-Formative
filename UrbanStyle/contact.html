<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UrbanStyle | Contact Us</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="site-header">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                UrbanStyle
            </a>

            <nav class="nav-links">

                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="shop.html">Shop</a>
                <a href="product.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="checkout.html">Checkout</a>
                <a href="contact.html">Contact</a>

            </nav>

        </div>

    </header>


    <main>

        <section class="featured-products">

            <div class="container">

                <div class="section-heading">

                    <p class="section-label">
                        CONTACT US
                    </p>

                    <h1>
                        Get In Touch
                    </h1>

                    <p>
                        Have a question? Send us a message.
                    </p>

                </div>


                <div class="product-card">

                    <div class="product-info">

                        <form>

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                required
                            >

                            <br>

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                required
                            >

                            <br>

                            <label for="message">
                                Message
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required>
                            </textarea>

                            <br><br>

                            <button
                                type="submit"
                                class="button">
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="copyright">

            <p>
                &copy; 2026 UrbanStyle Clothing Store.
                All Rights Reserved.
            </p>

        </div>

    </footer>

</body>

</html>
